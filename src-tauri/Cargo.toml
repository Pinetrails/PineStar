[package]
name = "skynet-desktop"
version = "0.1.0"
description = "Skynet — native desktop shell for the gamified AI-agent harness"
authors = ["andro"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }

# A small, fast desktop binary — strip symbols and optimize for size in release.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
