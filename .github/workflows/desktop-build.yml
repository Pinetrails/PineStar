# Desktop installer builds — Windows (NSIS) + Linux (deb/AppImage) + macOS (DMG).
#
# Tauri cannot cross-compile across OSes, so each platform builds on its own runner.
# macOS builds BOTH arches from the arm64 runner (same OS/SDK, only the Rust target
# differs); the Intel leg exists because old MacBook Airs are exactly the beginner
# hardware this product targets.
#
# Signing is tiered and every tier degrades gracefully — never a red build over keys:
#   TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)  -> updater artifacts (.sig); absent = skip them
#   APPLE_CERTIFICATE(+_PASSWORD) + APPLE_SIGNING_IDENTITY -> codesign the .app
#   APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID -> notarize (kills the Gatekeeper wall)
#   AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET -> Authenticode-sign the
#     Windows exe + bundled node sidecar + NSIS installer via Azure Trusted Signing
#     (account starnet-signing / eastus; kills the SmartScreen "unrecognized app" wall
#     and most Defender false positives). Absent = unsigned exe, still installable.
# With no Apple secrets the DMG is unsigned: fine for internal testing (System
# Settings -> Privacy & Security -> Open Anyway), not for public distribution.
# Operator setup for both signing tiers: docs/CODE_SIGNING.md.
#
# publish-test=true additionally publishes everything as a public PRE-release on
# starnet-releases (needs RELEASES_TOKEN, same secret release.yml uses) — a shareable
# no-login download link whose release notes ARE the per-OS install instructions.
# Pre-releases never become the repo's "latest", so the Windows updater feed
# (releases/latest/download/latest.json) cannot be disturbed by a test publish.
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      publish-test:
        description: "Publish a public test pre-release to starnet-releases (shareable download link)"
        required: false
        default: "false"
  # No tag trigger: v* tags run release-train.yml (the shipping path). This workflow is for
  # manual test builds / shareable pre-releases only.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            bundles: nsis
          - os: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            target: darwin-arm64
            bundles: dmg
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-x64
            bundles: dmg
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux system deps (webkit + tauri build chain + dbus for keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Stage bundled Node sidecar runtime
        run: node scripts/prepare-node.mjs ${{ matrix.target }}

      - name: Build desktop bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          # Absent secrets arrive as EMPTY strings, and Tauri treats a present-but-empty
          # APPLE_* var as "cert provided" — it then runs `security import` on zero bytes and
          # the build dies (SecKeychainItemImport: not valid). Same empty-env-!=-absent family
          # as the Windows updater-signing stall. Unset every empty one so absence is absence.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no Apple signing cert in secrets — DMG will be UNSIGNED (internal testing only)"
          fi
          # Windows Authenticode tier: with the AZURE_* service-principal secrets present,
          # inject a signCommand pointing at Azure Trusted Signing. Tauri then signs the app
          # exe, the bundled node sidecar (externalBin), and the NSIS installer/uninstaller.
          # Config injected via --config (not committed to tauri.conf.json) so local/keyless
          # builds never try to reach Azure.
          SIGN_CFG=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "${AZURE_CLIENT_SECRET:-}" ] && [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
              cargo install trusted-signing-cli --locked
              SIGN_CFG='{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a starnet-signing -c starnet-public %1"}}}'
              echo "::notice::Windows Authenticode signing ENABLED (Azure Trusted Signing: starnet-signing/starnet-public)"
            else
              echo "::warning::no Azure Trusted Signing secrets — Windows exe/installer will be UNSIGNED (SmartScreen warning for users)"
            fi
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::no updater signing key in secrets — building installers without updater artifacts"
            npm run tauri -- build --bundles ${{ matrix.bundles }} ${RUST_TARGET:+--target $RUST_TARGET} --config '{"bundle":{"createUpdaterArtifacts":false}}' ${SIGN_CFG:+--config "$SIGN_CFG"}
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }} ${RUST_TARGET:+--target $RUST_TARGET} ${SIGN_CFG:+--config "$SIGN_CFG"}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: starnet-${{ matrix.target }}
          if-no-files-found: error
          # ** matches zero segments: covers target/release (host builds) AND
          # target/<triple>/release (mac legs built with an explicit --target)
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig

  publish-test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish-test == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish public test pre-release (the notes ARE the install guide)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="test-v${VERSION}-r${{ github.run_number }}"
          cat > notes.md <<'NOTES'
          Test build — not a public release. Pick your platform:

          ## macOS
          1. Download the **`x64`** `.dmg` — on **every** Mac, including Apple Silicon (M1/M2/M3/M4). Until the build is notarized, macOS blocks the native `aarch64` build outright on Apple Silicon; the `x64` one runs everywhere (Apple Silicon uses Rosetta 2).
          2. Open it and drag **StarNet** onto the **Applications** folder.
          3. Launch it from Applications. If macOS says the app was **blocked**: click **Done**, then open **System Settings → Privacy & Security**, scroll to the bottom, click **Open Anyway**, and enter your password. One time only — this build isn't notarized yet.

          ## Windows
          Run the `-setup.exe`. If SmartScreen objects: **More info → Run anyway**.
          NOTES
          find dist -type f
          # Windows + mac only on the public page (release-platforms law: Linux installers are untested, never published)
          ASSETS=$(find dist -type f \( -name '*.dmg' -o -name '*-setup.exe' \))
          gh release create "$TAG" \
            --repo androoAGI/starnet-releases \
            --title "StarNet ${VERSION} test build (r${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease \
            $ASSETS
          echo "::notice::shareable download page: https://github.com/androoAGI/starnet-releases/releases/tag/$TAG"
