# Desktop installer builds — Windows (NSIS) + Linux (deb/AppImage) + macOS (DMG).
#
# Tauri cannot cross-compile across OSes, so each platform builds on its own runner.
# macOS builds BOTH arches from the arm64 runner (same OS/SDK, only the Rust target
# differs); the Intel leg exists because old MacBook Airs are exactly the beginner
# hardware this product targets.
#
# Signing is tiered and every tier degrades gracefully — never a red build over keys:
#   TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)  -> updater artifacts (.sig); absent = skip them
#   APPLE_CERTIFICATE(+_PASSWORD) + APPLE_SIGNING_IDENTITY -> codesign the .app
#   APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID -> notarize (kills the Gatekeeper wall)
# With no Apple secrets the DMG is unsigned: fine for internal testing (System
# Settings -> Privacy & Security -> Open Anyway), not for public distribution.
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            bundles: nsis
          - os: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            target: darwin-arm64
            bundles: dmg
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-x64
            bundles: dmg
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux system deps (webkit + tauri build chain + dbus for keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Stage bundled Node sidecar runtime
        run: node scripts/prepare-node.mjs ${{ matrix.target }}

      - name: Build desktop bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no Apple signing cert in secrets — DMG will be UNSIGNED (internal testing only)"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::no updater signing key in secrets — building installers without updater artifacts"
            npm run tauri -- build --bundles ${{ matrix.bundles }} ${RUST_TARGET:+--target $RUST_TARGET} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }} ${RUST_TARGET:+--target $RUST_TARGET}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: starnet-${{ matrix.target }}
          if-no-files-found: error
          # ** matches zero segments: covers target/release (host builds) AND
          # target/<triple>/release (mac legs built with an explicit --target)
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
