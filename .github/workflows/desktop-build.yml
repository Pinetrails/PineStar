# Desktop installer builds — Windows (NSIS) + Linux (deb/AppImage).
#
# Tauri cannot cross-compile, so each platform builds on its own runner.
# macOS is intentionally absent until the Apple Developer account exists
# (unsigned .dmg hits Gatekeeper's "damaged" wall — worse than shipping nothing).
#
# Updater artifacts (.sig + updater bundles) are signed only when the repo has
# TAURI_SIGNING_PRIVATE_KEY in Actions secrets; without it the build still
# produces installers, just no updater artifacts — never a red build over signing.
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            bundles: nsis
          - os: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux system deps (webkit + tauri build chain + dbus for keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage bundled Node sidecar runtime
        run: node scripts/prepare-node.mjs ${{ matrix.target }}

      - name: Build desktop bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::no updater signing key in secrets — building installers without updater artifacts"
            npm run tauri -- build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: starnet-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
