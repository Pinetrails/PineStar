# Stages the guarded public artifact, then deploys website-deploy/ to GitHub Pages.
#
# One-time setup after the repo is public:
#   Settings -> Pages -> Source: "GitHub Actions"
# Then run this workflow from the Actions tab (workflow_dispatch), or push a
# change to the website or its staging contract on the default branch.
#
# Custom domain later: add a CNAME record at your DNS host pointing to
# <owner>.github.io, set the domain in Settings -> Pages, and commit a
# website/CNAME file containing the bare domain so deploys keep it.
name: deploy-website

on:
  workflow_dispatch:
  push:
    branches: [main, feat/harness-backend]
    paths:
      - 'website/**'
      - 'scripts/stage-website-deploy.mjs'
      - 'package.json'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage guarded website artifact
        run: npm run website:stage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-deploy
      - id: deployment
        uses: actions/deploy-pages@v4
