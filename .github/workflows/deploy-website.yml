# Deploys website/ to GitHub Pages.
#
# One-time setup after the repo is public:
#   Settings -> Pages -> Source: "GitHub Actions"
# Then run this workflow from the Actions tab (workflow_dispatch), or push a
# change under website/ on the default branch.
#
# Custom domain later: add a CNAME record at your DNS host pointing to
# <owner>.github.io, set the domain in Settings -> Pages, and commit a
# website/CNAME file containing the bare domain so deploys keep it.
name: deploy-website

on:
  workflow_dispatch:
  push:
    branches: [main, feat/harness-backend]
    paths: ['website/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
