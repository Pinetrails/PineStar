<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SKYNET — Crew Sprite Lab</title>
<style>
  html,body{margin:0;background:#0a0c10;color:#cfe;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
  h1{font-size:15px;letter-spacing:.12em;color:#7fd7ff;margin:14px 16px 2px}
  .sub{margin:0 16px 10px;color:#7c8a99}
  #wrap{padding:8px 12px 40px}
  canvas#lab{image-rendering:pixelated;background:
    repeating-conic-gradient(#11151b 0% 25%, #0c1014 0% 50%) 50% / 22px 22px;
    border:1px solid #1c2530;border-radius:8px;display:block;margin:8px}
  .legend{margin:6px 16px;color:#9fb}
</style>
</head>
<body>
<div id="wrap">
  <h1>SKYNET — CREW SPRITE LAB</h1>
  <p class="sub">Real pipeline: <code>SPRITES.init → drawBody → per-agent tint → SCALE</code>, shown at ×3 nearest-neighbour zoom. The crew <b>idles &amp; blinks</b>, <b>walks</b> all directions, and recolors per agent. Checkerboard = transparency.</p>
  <canvas id="lab" width="1010" height="1380"></canvas>
  <div class="legend" id="status">booting…</div>
</div>

<!-- mock agents so filterFor()/tintFrames() have colors to recolor toward.
     'NATIVE' is not in DATA.AGENT, so it renders untinted (native cyan eyes).
     ULTRON is intentionally untinted by assets.js (keeps red). -->
<script>
  window.DATA = { AGENT: {
    FORGE: { id:'FORGE', color:'#22d3ee' },   // cyan
    VOLT:  { id:'VOLT',  color:'#34d399' },   // green
    EMBER: { id:'EMBER', color:'#f59e0b' },   // amber
    NOVA:  { id:'NOVA',  color:'#a855f7' }     // violet
  }};
</script>
<script src="js/assets.js"></script>
<script>
const cv = document.getElementById('lab');
const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const status = document.getElementById('status');
const CW = 62, CH = 72, MAG = 3, pad = 12, headH = 24, labH = 16;
const cellW = CW*MAG + pad, cellH = CH*MAG + labH;
const tmp = document.createElement('canvas'); tmp.width = CW; tmp.height = CH;
const tctx = tmp.getContext('2d'); tctx.imageSmoothingEnabled = false;

function body(spec){ return Object.assign({ px:CW/2, py:CH-6, phase:0, dir:'south' }, spec); }

const rows = [
  { title:'CREW · idle + blink  (front / right / left / back)', cells:[
    { label:'S', b:body({id:'NATIVE',dir:'south'}) },
    { label:'E', b:body({id:'NATIVE',dir:'east'}) },
    { label:'W', b:body({id:'NATIVE',dir:'west'}) },
    { label:'N', b:body({id:'NATIVE',dir:'north'}) },
  ]},
  { title:'CREW · walk', cells:[
    { label:'S', b:body({id:'NATIVE',dir:'south',state:'walk'}) },
    { label:'E', b:body({id:'NATIVE',dir:'east',state:'walk'}) },
    { label:'W', b:body({id:'NATIVE',dir:'west',state:'walk'}) },
    { label:'N', b:body({id:'NATIVE',dir:'north',state:'walk'}) },
  ]},
  { title:'CREW · states', cells:[
    { label:'sit',   b:body({id:'NATIVE',sitting:true,dir:'south'}) },
    { label:'type',  b:body({id:'NATIVE',working:true}) },
    { label:'drink', b:body({id:'NATIVE',state:'social',sitting:true,hasCan:true}) },
  ]},
  { title:'TINT · the eyes carry each agent’s identity colour', cells:[
    { label:'cyan',   b:body({id:'FORGE',dir:'south'}) },
    { label:'green',  b:body({id:'VOLT',dir:'south'}) },
    { label:'amber',  b:body({id:'EMBER',dir:'south'}) },
    { label:'violet', b:body({id:'NOVA',dir:'south'}) },
  ]},
  { title:'ULTRON · apex leader (untinted, towers)', cells:[
    { label:'S', b:body({id:'ULTRON',dir:'south'}) },
    { label:'E', b:body({id:'ULTRON',dir:'east'}) },
    { label:'N', b:body({id:'ULTRON',dir:'north'}) },
    { label:'walk', b:body({id:'ULTRON',dir:'south',state:'walk'}) },
  ]},
];

function drawAll(t){
  ctx.clearRect(0, 0, cv.width, cv.height);   // clear only — never resize here
  let y = 10;
  for(const row of rows){
    ctx.fillStyle = '#7fd7ff'; ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.fillText(row.title, pad, y + 14); y += headH;
    let x = pad;
    for(const cell of row.cells){
      ctx.fillStyle = '#181d24'; ctx.fillRect(x, y, CW*MAG, CH*MAG);
      tctx.clearRect(0, 0, CW, CH);
      try { SPRITES.drawBody(tctx, cell.b, t); } catch(e){}
      ctx.drawImage(tmp, 0, 0, CW, CH, x, y, CW*MAG, CH*MAG);
      ctx.fillStyle = '#9fb'; ctx.font = '11px ui-monospace,monospace';
      ctx.fillText(cell.label, x + 2, y + CH*MAG + 12);
      x += cellW;
    }
    y += cellH + 8;
  }
  // NOTE: never assign cv.width/cv.height here — that wipes the bitmap we just drew.
  // canvas size is fixed in the markup; clearRect above is the only per-frame reset.
}

async function boot(){
  await SPRITES.init();
  if(!SPRITES.ready){ status.textContent = '✗ SPRITES.ready=false — manifest/frames failed to load'; return; }
  status.innerHTML = '✓ crew loaded — idle blinks every ~3s, walk ~10fps. ' + Object.keys(DATA.AGENT).length + ' tint agents + native + Ultron.';
  const t0 = performance.now();
  (function loop(){ drawAll(performance.now() - t0); requestAnimationFrame(loop); })();
}
boot();
</script>
</body>
</html>
