<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 100" role="img" aria-label="STARNET">
  <!-- STARNET chrome wordmark — crisp small-size companion to starnet-logo.png.
       The PNG is a 1100px ASCII-mosaic that turns to speckle below ~200px wide;
       this vector mark holds its edge at topbar size (30px tall) and any DPI.
       Letterforms: stencil skeletons stroked three times (dark rim → gold chrome
       gradient → bright core) with round joins, skewed for the brand italic.
       The A's crossbar is a 4-point star — the "STAR" in STARNET. -->
  <defs>
    <linearGradient id="sn-gold" x1="0" y1="16" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ffdf8e"/>
      <stop offset="0.46" stop-color="#f3a63b"/>
      <stop offset="0.56" stop-color="#b06108"/>
      <stop offset="0.82" stop-color="#d98a1e"/>
      <stop offset="1"    stop-color="#ffcf7a"/>
    </linearGradient>
    <!-- every letter skeleton in one path so the three stroke layers merge cleanly -->
    <path id="sn-skel" d="
      M44 20 L6 20 L6 50 L38 50 L38 80 L0 80
      M66 20 L106 20 M86 20 L86 84
      M130 84 L148 20 L152 20 L170 84
      M198 84 L198 20 L228 20 L228 52 L198 52 M214 52 L234 84
      M262 84 L262 20 L294 84 L294 20
      M362 20 L326 20 L326 84 L362 84 M326 52 L350 52
      M386 20 L426 20 M406 20 L406 84"/>
  </defs>
  <g transform="translate(26,0) skewX(-13)">
    <use href="#sn-skel" fill="none" stroke="#241200" stroke-width="19"   stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#sn-skel" fill="none" stroke="url(#sn-gold)" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#sn-skel" fill="none" stroke="#ffe9ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- the A's star crossbar -->
    <polygon points="150,45 152.8,55.2 163,58 152.8,60.8 150,71 147.2,60.8 137,58 147.2,55.2"
             fill="url(#sn-gold)" stroke="#241200" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="150,49 151.9,56.1 159,58 151.9,59.9 150,67 148.1,59.9 141,58 148.1,56.1"
             fill="#ffe9ad" opacity="0.7"/>
  </g>
</svg>
